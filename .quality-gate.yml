# `excludedCheckers` and `enabledCheckers`, not `exclude` and `checkers`.
#
# The gate ignores keys it does not recognise, so the superseded names produced a file
# that described a checker selection which never ran — the defaults ran instead, and the
# mismatch surfaced only as an advisory note. A survey on 2026-08-25 found 11 of 73
# repositories carrying the old names, every one of them scaffolded from here.
#
# Not `excludePatterns`, which is what the gate's own "did you mean" suggests: that key
# holds file globs, so taking the suggestion turns a checker name into a pattern that
# matches nothing and excludes nothing.
docTarget: SwiftWebAuthn

excludedCheckers:
  - disk-clean

enabledCheckers:
  - all
  - logging

# Without this the status auditor looks for a master plan inside the framework's own
# directory, finds none, and skips. A checker that skips is not a checker that passed.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# The corpus stays named, and the path is relative rather than absolute.
#
# Relative because an absolute one encoded a home directory and a Dropbox layout true on exactly
# one machine. Named at all because deleting the block would not fail the consistency checker —
# it would make it skip, and a checker that skips is not a checker that passed. This is the only
# reference to a sibling repository here, it is build tooling rather than product, and it
# resolves to a checkout beside this one.
#
# If this package is ever made public, this block is what to revisit.
consistency:
  corpusPath: ../org-judgement-corpus
  projectID: SwiftWebAuthn
  consistencyThreshold: 0.7
  defaultRiskTier: 2

ijs:
  projectID: "SwiftWebAuthn"
  corpusPath: "../org-judgement-corpus"
  decisionOwner: "jpurnell"
  defaultRiskTier: 2
  remoteURL: "git@github.com:jpurnell/org-judgement-corpus.git"
